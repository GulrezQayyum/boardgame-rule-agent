<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Board Game Rule Conflict Resolver architecture</title>
  <desc id="desc">A flow diagram showing Next.js, the model, tool calls, and Sanity Content Lake.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070914"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="105" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">How the resolver works</text>
  <text x="100" y="150" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="22">Sanity supplies the structured evidence; the model explains a ruling from retrieved context.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="100" y="330" width="250" height="140" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <text x="225" y="385" text-anchor="middle" fill="#fbbf24" font-size="18" font-family="monospace">USER</text>
    <text x="225" y="425" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">Resolver UI</text>
    <text x="225" y="452" text-anchor="middle" fill="#94a3b8" font-size="16">cards + phase + question</text>
    <rect x="480" y="330" width="250" height="140" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <text x="605" y="385" text-anchor="middle" fill="#fbbf24" font-size="18" font-family="monospace">NEXT.JS API</text>
    <text x="605" y="425" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">Agent route</text>
    <text x="605" y="452" text-anchor="middle" fill="#94a3b8" font-size="16">validates + orchestrates</text>
    <rect x="860" y="330" width="250" height="140" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
    <text x="985" y="385" text-anchor="middle" fill="#34d399" font-size="18" font-family="monospace">MODEL</text>
    <text x="985" y="425" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">Groq reasoning</text>
    <text x="985" y="452" text-anchor="middle" fill="#94a3b8" font-size="16">chooses Sanity tools</text>
    <rect x="1240" y="250" width="260" height="300" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <text x="1370" y="305" text-anchor="middle" fill="#fbbf24" font-size="18" font-family="monospace">SANITY</text>
    <text x="1370" y="345" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">Content Lake</text>
    <rect x="1275" y="380" width="190" height="40" rx="8" fill="#1e293b"/>
    <text x="1370" y="406" text-anchor="middle" fill="#cbd5e1" font-size="17">Game Cards</text>
    <rect x="1275" y="435" width="190" height="40" rx="8" fill="#1e293b"/>
    <text x="1370" y="461" text-anchor="middle" fill="#cbd5e1" font-size="17">Core Rules</text>
    <rect x="1275" y="490" width="190" height="40" rx="8" fill="#1e293b"/>
    <text x="1370" y="516" text-anchor="middle" fill="#cbd5e1" font-size="17">Errata + Conflicts</text>
    <line x1="350" y1="400" x2="480" y2="400" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="730" y1="400" x2="860" y2="400" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1110" y1="400" x2="1240" y2="400" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1370 550V690H605V470" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
    <text x="970" y="678" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="monospace">GROQ RESULTS RETURN AS CITED CONTEXT</text>
  </g>
  <rect x="100" y="755" width="1400" height="54" rx="12" fill="#10b981" fill-opacity=".1" stroke="#10b981" stroke-opacity=".35"/>
  <text x="800" y="790" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="18">NO MATCHING SOURCE → LOW CONFIDENCE + EXPLICIT INSUFFICIENT-DATA RESPONSE</text>
</svg>
