<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Board Game Rule Conflict Resolver</title>
  <desc id="desc">Sanity-powered source-grounded rulings for complex card interactions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="60" r="260" fill="none" stroke="#fbbf24" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1390" cy="60" r="190" fill="none" stroke="#fbbf24" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="140" cy="800" r="250" fill="none" stroke="#10b981" stroke-opacity=".08" stroke-width="2"/>
  <rect x="110" y="108" width="1380" height="684" rx="28" fill="#0f172a" fill-opacity=".72" stroke="#334155" stroke-width="2"/>
  <text x="170" y="190" fill="#fbbf24" font-family="monospace" font-size="22" letter-spacing="5">TOURNAMENT DESK / RULING INTAKE</text>
  <rect x="170" y="230" width="196" height="38" rx="8" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".35"/>
  <text x="190" y="256" fill="#fbbf24" font-family="monospace" font-size="17">SANITY CONTENT LAKE</text>
  <rect x="382" y="230" width="184" height="38" rx="8" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-opacity=".35"/>
  <text x="404" y="256" fill="#34d399" font-family="monospace" font-size="17">TOOL-ASSISTED</text>
  <text x="170" y="365" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700">Board Game Rule</text>
  <text x="170" y="438" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700">Conflict Resolver</text>
  <text x="170" y="500" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="25">Source-grounded answers for complex card interactions.</text>
  <text x="170" y="545" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="25">Cards, errata, and rule priorities are managed in Sanity.</text>
  <g filter="url(#shadow)">
    <rect x="1000" y="270" width="350" height="390" rx="20" fill="#020617" stroke="#475569" stroke-width="2"/>
    <rect x="1030" y="305" width="290" height="56" rx="10" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".35"/>
    <text x="1052" y="340" fill="#fbbf24" font-family="monospace" font-size="15">SANITY CONTEXT</text>
    <text x="1030" y="404" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Mirror Shield</text>
    <text x="1030" y="436" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="17">Reflects incoming spells</text>
    <text x="1030" y="492" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Piercing Bolt</text>
    <text x="1030" y="524" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="17">Unblockable by shields</text>
    <line x1="1030" y1="560" x2="1320" y2="560" stroke="#1e293b" stroke-width="2"/>
    <circle cx="1050" cy="603" r="8" fill="#34d399"/>
    <text x="1070" y="610" fill="#34d399" font-family="monospace" font-size="18">HIGH CONFIDENCE</text>
  </g>
  <text x="170" y="710" fill="#64748b" font-family="monospace" font-size="18">NEXT.JS  •  GROQ  •  SANITY  •  GROQ QUERY LANGUAGE</text>
</svg>
